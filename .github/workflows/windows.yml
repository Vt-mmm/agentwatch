name: windows

# Agent Watch for Windows: tests on every change, and on a windows-v* tag a
# release with self-contained builds (x64 and arm64; no .NET install needed).
on:
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test windows/AgentWatch.Windows.sln -c Release
      - name: Publish
        shell: pwsh
        run: |
          foreach ($rid in @("win-x64", "win-arm64")) {
            $out = "windows/publish/AgentWatch-$rid"
            dotnet publish windows/src/AgentWatch.App -c Release -r $rid --self-contained -o $out
            dotnet publish windows/src/AgentWatch.Cli -c Release -r $rid --self-contained -o $out
            # Both programs must survive the shared folder (names are case-insensitive here).
            foreach ($exe in "AgentWatchApp.exe", "agentwatch.exe") { if (-not (Test-Path "$out/$exe")) { throw "$exe missing from $out" } }
            Compress-Archive -Path "$out/*" -DestinationPath "windows/publish/AgentWatch-$rid.zip"
          }
          # LF line endings, so `shasum -c` and `sha256sum -c` read it too.
          $sums = Get-FileHash windows/publish/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)`n" }
          [IO.File]::WriteAllText("$PWD/windows/publish/SHA256SUMS", -join $sums)
      - uses: actions/upload-artifact@v4
        with:
          name: agentwatch-windows
          path: |
            windows/publish/*.zip
            windows/publish/SHA256SUMS

  # The one-command setup (setup.ps1) end to end, as members run it: Windows
  # PowerShell 5.1, a fresh Ubuntu in WSL whose only user is root, twice (the
  # second run is the update path). Agent Watch is skipped: no connection code.
  setup:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
      # Members run the scripts as `irm ... | iex`: Windows PowerShell 5.1
      # decodes the download as UTF-8 (raw.githubusercontent.com sends
      # charset=utf-8), so parse the UTF-8 text, not the file (5.1 reads a
      # BOM-less file as ANSI), and check that decoding on the published copy.
      - name: Parse as irm | iex does in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($file in "windows/setup.ps1", "windows/install.ps1") {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText((Resolve-Path $file).Path, [Text.Encoding]::UTF8), [ref]$null, [ref]$errors)
            if ($errors) { $errors | Out-String | Write-Host; throw "$file does not parse in Windows PowerShell 5.1" }
          }
          $published = Invoke-RestMethod "https://raw.githubusercontent.com/Vt-mmm/agentwatch/main/windows/install.ps1"
          $expected = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("Q2jGsGEgY8OzIGLhuqNuIEFnZW50IFdhdGNoIGNobyBXaW5kb3dzLg=="))
          if (-not $published.Contains($expected)) { throw "irm did not decode the published script as UTF-8" }
      - name: Setup, then the same command again
        shell: powershell
        env:
          AGENTWATCH_SETUP_BASE: ${{ github.workspace }}\windows
          # No PIAGENT_WSL_DISTRO: setup picks the existing Ubuntu-24.04.
          PIAGENT_SETUP_UNATTENDED: "1"
        run: |
          Invoke-Expression ([IO.File]::ReadAllText("$env:AGENTWATCH_SETUP_BASE\setup.ps1"))
          Invoke-Expression ([IO.File]::ReadAllText("$env:AGENTWATCH_SETUP_BASE\setup.ps1"))
      # Step 4 needs a Studio for the connection code; its install half and
      # the CLI's refusals run here, in Windows PowerShell 5.1.
      - name: Agent Watch installs from the latest windows-v release
        shell: powershell
        env:
          AGENTWATCH_NO_LAUNCH: "1"
        run: |
          Invoke-Expression ([IO.File]::ReadAllText("${{ github.workspace }}\windows\install.ps1"))
          $cli = Join-Path $env:LOCALAPPDATA "AgentWatch\app\agentwatch.exe"
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "agentwatch.exe does not run" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "AgentWatch\app\AgentWatchApp.exe"))) { throw "the app is missing" }
          $ErrorActionPreference = "Continue"
          "not-a-code" | & $cli connect -
          if ($LASTEXITCODE -eq 0) { throw "connect - accepted a bad code" }
          & $cli bind-wsl --distro Ubuntu-24.04
          if ($LASTEXITCODE -ne 1) { throw "bind-wsl without a company key should refuse with 1" }
          # The runner ends the step with the last native exit code.
          $global:LASTEXITCODE = 0
      # The WSL half of bind-wsl (no Studio needed): this build's CLI reads
      # Piagent's runtime, digests and Pi version through the real wsl.exe.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: check-wsl reads Piagent through the real wsl.exe
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "awcli"
          dotnet publish windows/src/AgentWatch.Cli -c Release -r win-x64 --self-contained -o $out | Out-Null
          $ErrorActionPreference = "Continue"
          $lines = @(& (Join-Path $out "agentwatch.exe") check-wsl --distro Ubuntu-24.04)
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "check-wsl failed ($code)" }
          if (-not ($lines -match '^Pi: 0\.87\.1$')) { throw "check-wsl did not read the Pi version" }
          if (-not ($lines -match 'user runneradmin')) { throw "check-wsl did not run as the member" }
          $global:LASTEXITCODE = 0
      - name: Ubuntu opens as the member with Piagent, the sandbox runs, Start menu has Piagent
        shell: powershell
        run: |
          $env:WSL_UTF8 = "1"
          $user = ((wsl.exe -d Ubuntu-24.04 -e id -un) | Out-String).Trim()
          if (-not $user -or $user -eq "root") { throw "Ubuntu still opens as '$user'" }
          wsl.exe -d Ubuntu-24.04 --cd "~" -e bash -lic "command -v piagent && test -s ~/.pi/agent/piagent-runtime.json"
          if ($LASTEXITCODE -ne 0) { throw "piagent is not on the member's PATH, or its runtime record is missing" }
          wsl.exe -d Ubuntu-24.04 -e bwrap --unshare-user --unshare-net --ro-bind / / true
          if ($LASTEXITCODE -ne 0) { throw "the bubblewrap sandbox does not run in WSL" }
          $link = Join-Path ([Environment]::GetFolderPath("Programs")) "Piagent.lnk"
          if (-not (Test-Path $link)) { throw "no Piagent entry in the Start menu" }
          (New-Object -ComObject WScript.Shell).CreateShortcut($link).Arguments

  # The tray app: one instance per user, and a second start (the Start-menu
  # entry while it runs in the background) brings its window forward.
  app:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: A second start shows the running window
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "awapp"
          dotnet publish windows/src/AgentWatch.App -c Release -r win-x64 --self-contained -o $out | Out-Null
          $env:AGENTWATCH_DATA_DIR = Join-Path $env:RUNNER_TEMP "awdata"
          $exe = Join-Path $out "AgentWatchApp.exe"
          Start-Process $exe -ArgumentList "--background"
          Start-Sleep 6
          $running = @(Get-Process AgentWatchApp)
          if ($running.Count -ne 1) { throw "expected one app, found $($running.Count)" }
          if ($running[0].MainWindowHandle -ne 0) { throw "--background showed the window" }
          Start-Process $exe
          Start-Sleep 6
          $running = @(Get-Process AgentWatchApp)
          if ($running.Count -ne 1) { throw "a second start left $($running.Count) apps" }
          $running[0].Refresh()
          if ($running[0].MainWindowHandle -eq 0) { throw "the second start did not show the window" }
          $running | Stop-Process -Force
      - name: Updating replaces the running app and broker
        shell: powershell
        env:
          AGENTWATCH_NO_LAUNCH: "1"
        run: |
          $install = [IO.File]::ReadAllText("${{ github.workspace }}\windows\install.ps1")
          Invoke-Expression $install
          $app = Join-Path $env:LOCALAPPDATA "AgentWatch\app"
          Start-Process (Join-Path $app "AgentWatchApp.exe") -ArgumentList "--background"
          # The broker Piagent in WSL keeps open: it waits on its standard input.
          $broker = New-Object Diagnostics.ProcessStartInfo (Join-Path $app "agentwatch.exe"), ("managed-broker --profile " + ("a" * 64))
          $broker.UseShellExecute = $false; $broker.RedirectStandardInput = $true
          $broker = [Diagnostics.Process]::Start($broker)
          Start-Sleep 6
          if (@(Get-Process AgentWatchApp).Count -ne 1 -or $broker.HasExited) { throw "the app and the broker should be running" }
          # The member's failure: the old copy's DLLs were still held.
          Invoke-Expression $install
          if (Get-Process AgentWatchApp, agentwatch -ErrorAction SilentlyContinue) { throw "the old app or broker kept running" }
          if (-not (Test-Path (Join-Path $app "AgentWatchApp.exe"))) { throw "the update left no app" }
          if (Get-ChildItem (Split-Path $app) -Directory -Filter "app-*") { throw "the unpacked copy was left behind" }

  # The Ubuntu half alone on a stock Ubuntu 24.04 VM, where AppArmor restricts
  # the user namespaces the sandbox needs.
  setup-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-ubuntu.sh as root, then as the member
        run: |
          sudo bash windows/setup-ubuntu.sh system "$USER"
          bash windows/setup-ubuntu.sh piagent "CI Member" ci@example.com | tee setup.log
          grep -qx SANDBOX-OK setup.log
          grep -q '^PIAGENT-VERSION ' setup.log

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentwatch-windows
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Block scalar: the command contains ": ", which ends a plain one.
        # Never "latest": that link is the macOS download.
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Agent Watch for Windows ${TAG#windows-v}" --latest=false \
            --notes "Agent Watch for Windows. Install: see windows/README.md." *.zip SHA256SUMS
