name: ClaudeWatchMac
options:
  bundleIdPrefix: com.vtamm.claudewatch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ClaudeWatchCore:
    path: .
targets:
  ClaudeWatchMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: App/Assets.xcassets
        type: folder
    dependencies:
      - package: ClaudeWatchCore
        product: ClaudeWatchCore
    info:
      path: App/Info.plist
      properties:
        LSUIElement: false
        LSMinimumSystemVersion: "14.0"
        CFBundleDisplayName: Claude Watch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 vtamm"
    settings:
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: NO
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      PRODUCT_BUNDLE_IDENTIFIER: com.vtamm.claudewatch.ClaudeWatchMac
      SWIFT_VERSION: "6.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
